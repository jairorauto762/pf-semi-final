<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: white;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background-color: #e0f7fa;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .receipt-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #ccc;
    }

    .total {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
    }

    .home-btn {
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #009688;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Receipt</h1>
  <div id="receipt-items"></div>
  <div class="total" id="receipt-total"></div>
  <button class="home-btn" onclick="goHome()">Back to Home</button>
</div>

<script>
  const receiptData = JSON.parse(localStorage.getItem('receipt') || '{}');
  const receiptItems = document.getElementById('receipt-items');
  const receiptTotal = document.getElementById('receipt-total');

  if (receiptData.order) {
    receiptData.order.forEach(item => {
      const div = document.createElement('div');
      div.className = 'receipt-item';
      div.innerHTML = `<div>${item.name} x${item.qty}</div><div>₱${item.subtotal}</div>`;
      receiptItems.appendChild(div);
    });

    receiptTotal.textContent = `Total: ₱${receiptData.total}`;
  } else {
    receiptItems.innerHTML = "<p>No receipt found.</p>";
  }

  function goHome() {
    localStorage.clear();
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
